[package]
name = "biophys-agent"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "biophys-agent"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "biophys_agent_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bincode = "1.3"
parking_lot = "0.12"
memmap2 = "0.9"

# [P2P 보안 — BLAKE3 챌린지-응답 암호 인증]
blake3 = "1"

# [데이터 압축 — Zstandard RFC 8878 딕셔너리 및 ANS 엔트로피 압축]
zstd = { version = "0.13", features = ["zstdmt"] }
rayon = "1.10"

# [AI 수학 텐서 코어 — 순수 Rust, 모든 플랫폼(Android 포함) 지원]
candle-core = "0.8"
futures-util = "0.3"

# [RAG 벡터 메모리 — rustls 기반 (OpenSSL 불필요)]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
kalosm-common = "0.4.0"
kalosm-model-types = "0.4.0"
hf-hub = { version = "0.3.2", features = ["tokio"] }
safetensors = "0.4.5"

# ================================================================
# Android에서 제외되는 의존성 (OpenSSL / C++ 바인딩 포함)
# ================================================================
[target.'cfg(not(target_os = "android"))'.dependencies]
# [BioPhys Native TTS Engine — C++ ONNX Runtime]
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
ndarray = { version = "0.17", features = ["std"] }
hound = "3.4"

# [kalosm — HuggingFace 모델 다운로더 (reqwest → native-tls → schannel)]
kalosm = { version = "0.4.0", features = ["language"] }

[profile.dev]
# MSVC Linker PDB 사이즈 오버플로우(LNK1318) 방지용 최적화
debug = 0
incremental = true
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
